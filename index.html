<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>XI Congrés de Geografia dels Serveis de l'AGE</title>
<style>
:root{--teal:#2f6f7a;--ink:#1d2327;--muted:#4a4f55;--bg:#eef3f4;--chip:#e3eef0;--line:#e1e6e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;padding:14px 10px 12px 16px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px}
.brand{min-width:0}
.brand img{display:block;width:200px;max-width:100%;height:auto}
.date{flex-basis:100%;margin:4px 0 0;font-size:12px;font-weight:600;line-height:16px;color:var(--teal)}
.lang{display:flex;flex:none}
.lang button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);min-width:40px;min-height:44px;padding:0 6px;cursor:pointer;border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.hero{background:var(--teal);color:#fff;padding:22px 20px 24px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.roles li{padding:4px 10px;border:1px solid rgba(255,255,255,.75);border-radius:999px;font-size:12px;font-weight:600;line-height:16px}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:800;line-height:31px;text-wrap:balance}
.hero p{margin:0;font-size:14px;line-height:20px}
.card{background:#fff;border-radius:12px;padding:18px;margin:16px 16px 0;display:flex;flex-direction:column;gap:12px}
.label{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;line-height:16px;text-transform:uppercase;color:var(--teal)}
.title{margin:0;font-size:18px;font-weight:700;line-height:24px}
.authors{margin:0;font-size:13px;line-height:18px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:10px;margin:2px 0 0;padding:0;list-style:none}
.rows li{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px}
.rows svg{flex:none;margin-top:1px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.kw li{padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--teal);font-size:12px;font-weight:600;line-height:16px}
.btn{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;border-radius:10px;background:var(--teal);color:#fff;font-size:16px;font-weight:600;text-decoration:none}
.links{display:flex;flex-direction:column;margin-top:-6px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
.links a:last-child{border-bottom:0}
.links svg{flex:none}
.who{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.who small{font-size:13px;color:var(--muted)}
a:focus-visible,button:focus-visible{outline:3px solid #e8a33d;outline-offset:2px;border-radius:6px}
.space{height:16px}
footer{margin-top:auto;background:#fff;padding:22px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px}
.logos{display:flex;align-items:center;gap:22px}
.logos img{display:block;height:28px;width:auto}
footer p{margin:0;font-size:12px;line-height:16px;color:var(--muted);text-align:center}
</style>
</head>

<script>
/* ===== DADES =====
   Per afegir una persona, copieu un bloc de PEOPLE i canvieu-ne els camps.
   L'adreça del seu perfil serà .../#id (per exemple .../#mesa-martinez).
   "talk" i "cv" són opcionals: si una persona no presenta res, esborreu "talk". */
const PROGRAMME = {
  ca: "https://webs.uab.cat/xi-geografia-serveis/wp-content/uploads/sites/693/2026/11/Mod_4a_circular_cat.pdf",
  es: "https://webs.uab.cat/xi-geografia-serveis/wp-content/uploads/sites/693/2026/11/Mod_4a_circular_es.pdf",
  en: "https://webs.uab.cat/xi-geografia-serveis/wp-content/uploads/sites/693/2026/11/def_4a_circular_en.pdf"
};
const PEOPLE = [
  {
    id: "mesa-martinez",
    name: "Andrés Felipe Mesa Martínez",
    roles: ["organitzador", "comunicant"],
    position: { ca: "Doctorand en Geografia", es: "Doctorando en Geografía", en: "PhD candidate in Geography" },
    institution: "Universitat Autònoma de Barcelona",
    cv: "https://www.linkedin.com/in/afelipemesa/",
    talk: {
      title: "Una mirada ética al estudio de la movilidad: de cuestión tecnicista a fenómeno humanista",
      lang: "es",
      authors: ["Andrés Felipe Mesa Martínez", "Àngel Cebollada Frontera"],
      affiliation: "UAB",
      when: { ca: "Dijous 26 de novembre · sessió de les 15:30", es: "Jueves 26 de noviembre · sesión de las 15:30", en: "Thursday 26 November · 15:30 session" },
      place: "L'Escorxador · Vilafranca del Penedès",
      session: { ca: "Mobilitat i Transport (III) · Subeix Transport", es: "Movilidad y Transporte (III) · Subeje Transporte", en: "Mobility and Transport (III) · Transport sub‑theme" },
      chair: "Ana Vera Martín",
      keywords: ["habitus", "individualismo", "sostenibilidad", "rostro del otro", "justicia"]
    }
  }
];
const UI = {
  ca: { date: "25–27 nov. 2026 · Bellaterra · Penedès · Olot", congress: "XI Congrés de Geografia dels Serveis de l'AGE", nav: "Idioma", and: "i",
        roles: { organitzador: "Comitè organitzador", ponent: "Ponent", comunicant: "Comunicant", assistent: "Assistent" },
        talk: "La meva comunicació", chair: "Modera", knowMe: "Coneix-me", cv: "Mira el meu CV",
        atCongress: "Al congrés", programme: "Programa complet (Circular 4)", all: "Tots els participants", participants: "Participants" },
  es: { date: "25–27 nov. 2026 · Bellaterra · Penedès · Olot", congress: "XI Congreso de Geografía de los Servicios de la AGE", nav: "Idioma", and: "y",
        roles: { organitzador: "Comité organizador", ponent: "Ponente", comunicant: "Comunicante", assistent: "Asistente" },
        talk: "Mi comunicación", chair: "Modera", knowMe: "Conóceme", cv: "Mira mi CV",
        atCongress: "En el congreso", programme: "Programa completo (Circular 4)", all: "Todos los participantes", participants: "Participantes" },
  en: { date: "25–27 Nov 2026 · Bellaterra · Penedès · Olot", congress: "11th AGE Congress on the Geography of Services", nav: "Language", and: "and",
        roles: { organitzador: "Organising committee", ponent: "Keynote speaker", comunicant: "Presenter", assistent: "Attendee" },
        talk: "My presentation", chair: "Chaired by", knowMe: "Get to know me", cv: "See my CV",
        atCongress: "At the congress", programme: "Full programme (4th circular)", all: "All participants", participants: "Participants" }
};

/* ===== PÀGINA ===== */
const svg = (d, color) => '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + (color || "#2f6f7a") + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + "</svg>";
const ICON = {
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  pin: svg('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
  layers: svg('<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>'),
  user: svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
  next: svg('<path d="m9 18 6-6-6-6"/>'),
  nextW: svg('<path d="m9 18 6-6-6-6"/>', "#ffffff")
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const joinList = (xs, and) => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " " + and + " " + xs[xs.length - 1];

function profile(p, L) {
  const t = UI[L];
  let h = '<section class="hero"><ul class="roles">' + p.roles.map(r => "<li>" + esc(t.roles[r]) + "</li>").join("") + "</ul>" +
    "<h1>" + esc(p.name) + "</h1><p>" + esc(p.position[L]) + "</p><p>" + esc(p.institution) + "</p></section>";
  if (p.talk) {
    const k = p.talk;
    h += '<section class="card" aria-labelledby="h-talk"><h2 class="label" id="h-talk">' + esc(t.talk) + "</h2>" +
      '<h3 class="title" lang="' + k.lang + '">' + esc(k.title) + "</h3>" +
      '<p class="authors">' + esc(joinList(k.authors, t.and)) + " (" + esc(k.affiliation) + ")</p>" +
      '<ul class="rows"><li>' + ICON.cal + "<span>" + esc(k.when[L]) + "</span></li><li>" + ICON.pin + "<span>" + esc(k.place) + "</span></li>" +
      "<li>" + ICON.layers + "<span>" + esc(k.session[L]) + "</span></li><li>" + ICON.user + "<span>" + esc(t.chair) + " " + esc(k.chair) + "</span></li></ul>" +
      (k.keywords && k.keywords.length ? '<ul class="kw" lang="' + k.lang + '">' + k.keywords.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") +
      "</section>";
  }
  if (p.cv) {
    h += '<section class="card" aria-labelledby="h-me"><h2 class="label" id="h-me">' + esc(t.knowMe) + "</h2>" +
      '<a class="btn" href="' + esc(p.cv) + '" target="_blank" rel="noopener">' + esc(t.cv) + ICON.nextW + "</a></section>";
  }
  h += '<section class="card" aria-labelledby="h-cg"><h2 class="label" id="h-cg">' + esc(t.atCongress) + '</h2><nav class="links">' +
    '<a href="' + PROGRAMME[L] + '" target="_blank" rel="noopener">' + esc(t.programme) + ICON.next + "</a>" +
    '<a href="#participants">' + esc(t.all) + ICON.next + "</a></nav></section>";
  return h;
}

function directory(L) {
  const t = UI[L];
  const people = PEOPLE.slice().sort((a, b) => a.name.localeCompare(b.name, L));
  return '<section class="hero"><h1>' + esc(t.participants) + "</h1><p>" + esc(t.congress) + "</p></section>" +
    '<section class="card"><nav class="links" aria-label="' + esc(t.participants) + '">' +
    people.map(p => '<a href="#' + p.id + '"><span class="who"><span>' + esc(p.name) + "</span><small>" + esc(p.institution) + "</small></span>" + ICON.next + "</a>").join("") +
    '</nav></section><section class="card"><nav class="links"><a href="' + PROGRAMME[L] + '" target="_blank" rel="noopener">' + esc(t.programme) + ICON.next + "</a></nav></section>";
}

const main = document.getElementById("main");
const langNav = document.getElementById("lang");
let lang = "ca";
try { const saved = localStorage.getItem("xigs-lang"); if (UI[saved]) lang = saved; } catch (e) {}
const asked = new URLSearchParams(location.search).get("lang");
if (UI[asked]) lang = asked;

function render() {
  const t = UI[lang];
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const p = PEOPLE.find(x => x.id === id);
  document.documentElement.lang = lang;
  document.title = (p ? p.name + " · " : "") + t.congress;
  document.getElementById("date").textContent = t.date;
  document.getElementById("congress").textContent = t.congress;
  langNav.setAttribute("aria-label", t.nav);
  langNav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  main.innerHTML = p ? profile(p, lang) : directory(lang);
}

langNav.addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("xigs-lang", lang); } catch (e) {}
  render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
